[package]
name = "burn-mamba"
version = "0.57.0"
edition = "2024"

[features]
default = ["mamba1", "mamba2", "mamba3", "autodiff", "optim", "backend-flex"]
mamba1 = []
mamba2 = ["autodiff"]
mamba3 = ["autodiff"]
autodiff = ["burn/autodiff", "burn-stack/autodiff"]
# Optimizer support (`crate::optim`): Muon parameter groups over the fused
# projections. Pulls `burn-optim` (which implies `burn/autodiff`).
optim = ["burn/optim", "burn/std", "autodiff", "burn-stack/optim"]
cubecl = ["dep:burn-cubecl", "burn/cubecl", "burn-stack/cubecl"]
fusion = ["burn/fusion", "dep:burn-fusion", "burn-stack/fusion"]
check-inf = ["burn-stack/check-inf"]
check-nan = ["burn-stack/check-nan"]
# Backend selection. With the Dispatch architecture each feature simply enables
# the corresponding burn backend; multiple may be compiled in simultaneously.
# At runtime the examples (and tests) use `Device::default()`, which resolves to
# an enabled backend (honouring the `BURN_DEVICE` env override). Each backend
# also turns on the internal `_dev-test` marker so the tensor test suite compiles
# under whichever backend is present.
backend-ndarray = ["burn/ndarray", "_dev-test", "burn-stack/backend-ndarray"]
backend-ndarray-blas-accelerate = ["backend-ndarray", "burn/std", "burn/accelerate", "burn-stack/backend-ndarray-blas-accelerate"]
backend-ndarray-blas-netlib = ["backend-ndarray", "burn/std", "burn/blas-netlib", "burn-stack/backend-ndarray-blas-netlib"]
backend-ndarray-blas-openblas = ["backend-ndarray", "burn/std", "burn/openblas", "burn-stack/backend-ndarray-blas-openblas"]
backend-flex = ["burn/flex", "_dev-test", "burn-stack/backend-flex"]
backend-flex-rayon = ["backend-flex", "dep:burn-flex", "burn-flex?/rayon", "burn-stack/backend-flex-rayon"]
backend-cpu = ["burn/cpu", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-cpu"]
backend-tch-cpu = ["burn/tch", "burn/std", "_dev-test", "burn-stack/backend-tch-cpu"]
backend-tch-gpu = ["burn/tch", "burn/std", "_dev-test", "burn-stack/backend-tch-gpu"]
backend-wgpu = ["burn/wgpu", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-wgpu"]
backend-webgpu = ["burn/webgpu", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-webgpu"]
backend-metal = ["burn/metal", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-metal"]
backend-vulkan = ["burn/vulkan", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-vulkan"]
backend-cuda = ["burn/cuda", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-cuda"]
backend-rocm = ["burn/rocm", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-rocm"]
backend-remote = ["burn/remote", "burn/std", "cubecl", "_dev-test", "burn-stack/backend-remote"]
# misc features for tests or examples
# `_dev-test` (internal): enabled by every `backend-*` so the tensor test suite
# compiles whenever a backend is present. Not meant to be enabled directly.
_dev-test = ["burn-stack/_dev-test"]
dev-f16 = ["burn-stack/dev-f16"]
dev-simd = ["burn/simd", "burn/std", "burn-stack/dev-simd"]
dev-autotune = ["burn/autotune", "burn-stack/dev-autotune"]

[dependencies]
burn-stack = { git = "https://github.com/swfsql/burn-stack.git", rev = "b9ce3442df557716137efea68f550c5e3d73ace0", default-features = false }
serde = { version = "1.0.0", features = ["derive"] }
# burn-flex = { version = "0.22.0-pre.3", default-features = false, optional = true }
burn-flex = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, optional = true }

### For the main branch. ###
# burn = { version = "0.22.0-pre.3", default-features = false, features = ["extension"]}
# burn-cubecl = { version = "0.22.0-pre.3", default-features = false, optional = true}
# burn-fusion = { version = "0.22.0-pre.3", default-features = false, optional = true}
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, features = ["extension"] }
burn-cubecl = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, optional = true}
burn-fusion = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, optional = true}

### For local development. ###
# burn = { path = "../burn/crates/burn", default-features = false, features = ["extension"] }
# burn-cubecl = { path = "../burn/crates/burn-cubecl", default-features = false, optional = true }
# burn-fusion = { path = "../burn/crates/burn-fusion", default-features = false, optional = true }

[dev-dependencies]
burn-stack = { git = "https://github.com/swfsql/burn-stack.git", rev = "b9ce3442df557716137efea68f550c5e3d73ace0", default-features = false, features = ["test-helpers", "examples-common"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
num-traits = "0.2.19"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
pico-args = { version = "0.5.0", features = ["eq-separator", "combined-flags"] }
image = "0.25.10"

### For the main branch. ###
# burn = { version = "0.22.0-pre.3", default-features = false, features = ["autodiff", "train", "dataset", "std", "optim", "extension"]}
# burn-dataset = { version = "0.22.0-pre.3", features = ["network"] }
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", default-features = false, features = ["autodiff", "train", "dataset", "std", "optim", "extension"]}
burn-dataset = { git = "https://github.com/tracel-ai/burn.git", rev = "8f08fdad05e734918efd695b11ebe13d92a8714e", features = ["network"] }

### For local development. ###
# burn = { path = "../burn/crates/burn", default-features = false, features = ["autodiff", "train", "dataset", "std"] }
# burn-dataset = { path = "../burn/crates/burn-dataset", default-features = false, features = ["network"] }
[[bench]]
name = "layer"
harness = false

# The `reset-*` ladder lives one directory deeper (`examples/reset/`, sharing one
# README), which is past cargo's `examples/<name>/main.rs` autodiscovery.
[[example]]
name = "reset-majority"
path = "examples/reset/majority/main.rs"

[[example]]
name = "reset-rotor"
path = "examples/reset/rotor/main.rs"

[[example]]
name = "reset-spinor"
path = "examples/reset/spinor/main.rs"

[[example]]
name = "reset-swap"
path = "examples/reset/swap/main.rs"

[[example]]
name = "reset-quintic"
path = "examples/reset/quintic/main.rs"

[[example]]
name = "spinor-product"
path = "examples/reset/spinor-product/main.rs"

# The `tally-*` ladder: what a second, positive system beside the plant buys
# (`examples/tally/`, sharing one README).
[[example]]
name = "tally-depth"
path = "examples/tally/depth/main.rs"

[[example]]
name = "tally-record"
path = "examples/tally/record/main.rs"

[[example]]
name = "tally-drift"
path = "examples/tally/drift/main.rs"

# tracel-ai/burn#5772 ("Related: a capture needs ~3x a pass's memory"): burn and
# cubecl at the pinned revs plus one line each — burn's `capture` primes only
# its last warm-up, cubecl pins only what the recording touched — so a captured
# graph holds one pass's memory instead of three. Every burn and cubecl crate in
# the dependency graph is patched (a missing one links a second copy).
[patch."https://github.com/tracel-ai/burn.git"]
burn = { git = "https://github.com/swfsql/burn.git", rev = "143bff617c988bdd3245fe0093f789fbdc5585cb" }
