name: Check
on:
    push:
        branches:
            - main
env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: ./scripts/check.sh
